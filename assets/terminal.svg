<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="820" height="300" viewBox="0 0 820 300">
  <style>
    .bg { fill: #0d1117; }
    .bar { fill: #161b22; }
    .t { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 15px; fill: #c9d1d9; }
    .p { fill: #7ee787; }
    .c { fill: #79c0ff; }
    .k { fill: #ff7b72; }
    .s { fill: #a5d6ff; }
    .m { fill: #8b949e; }
    .line { opacity: 0; animation: show 0.35s ease forwards; }
    .l1 { animation-delay: 0.4s; }
    .l2 { animation-delay: 1.2s; }
    .l3 { animation-delay: 2.0s; }
    .l4 { animation-delay: 2.6s; }
    .l5 { animation-delay: 3.2s; }
    .l6 { animation-delay: 3.8s; }
    .l7 { animation-delay: 4.6s; }
    .l8 { animation-delay: 5.4s; }
    .cursor { animation: blink 1s steps(1) infinite; fill: #7ee787; }
    .glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes show { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { stroke-opacity: 0.35; } 50% { stroke-opacity: 0.9; } }
  </style>
